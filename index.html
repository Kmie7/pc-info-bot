<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC Info & Tech Assistant Bot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Gaming background ── */
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background-color: #050810;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0,255,170,0.04) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0,255,170,0.04) 40px),
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(0,255,170,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(157,0,255,0.09) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 10%, rgba(0,170,255,0.06) 0%, transparent 50%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Chat wrapper ── */
    .chat-wrapper {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      height: 92vh;
      max-height: 860px;
      background: #0d1117;
      border-radius: 16px;
      border: 1px solid rgba(0,255,170,0.25);
      box-shadow:
        0 0 0 1px rgba(0,255,170,0.08),
        0 0 30px rgba(0,255,170,0.08),
        0 0 80px rgba(157,0,255,0.06),
        0 24px 60px rgba(0,0,0,0.7);
      overflow: hidden;
    }

    /* ── Header ── */
    .chat-header {
      background: linear-gradient(135deg, #0d1f14 0%, #0a0f1e 100%);
      border-bottom: 1px solid rgba(0,255,170,0.2);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    .chat-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #00ffaa, #9d00ff, #00aaff, transparent);
    }
    .bot-avatar {
      width: 42px; height: 42px;
      background: #0d1f14;
      border: 1.5px solid #00ffaa;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(0,255,170,0.4);
    }
    .bot-avatar svg { width: 26px; height: 26px; }
    .header-text h1 {
      font-size: 15px; font-weight: 700; line-height: 1.2;
      color: #00ffaa;
      letter-spacing: 0.3px;
    }
    .header-text p { font-size: 12px; color: #7eeac4; margin-top: 2px; }
    .status-dot {
      width: 9px; height: 9px;
      background: #00ffaa;
      border-radius: 50%;
      margin-left: auto;
      flex-shrink: 0;
      box-shadow: 0 0 8px #00ffaa;
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 6px #00ffaa; }
      50% { box-shadow: 0 0 14px #00ffaa, 0 0 24px rgba(0,255,170,0.4); }
    }

    /* ── Messages area ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: rgba(0,255,170,0.2); border-radius: 4px; }

    /* ── Bubbles ── */
    .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
    }
    .msg.bot .msg-avatar {
      background: #0d1f14;
      border: 1px solid rgba(0,255,170,0.3);
      color: #00ffaa;
    }
    .msg.user .msg-avatar {
      background: #130d1f;
      border: 1px solid rgba(157,0,255,0.3);
      color: #c87aff;
    }

    .bubble {
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.65;
      max-width: 100%;
    }
    .msg.bot .bubble {
      background: #111820;
      color: #c9d8e8;
      border: 1px solid rgba(0,255,170,0.12);
      border-bottom-left-radius: 4px;
      box-shadow: 0 0 20px rgba(0,255,170,0.04);
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, #1a0a2e 0%, #2a0d4a 100%);
      color: #e8d4ff;
      border: 1px solid rgba(157,0,255,0.3);
      border-bottom-right-radius: 4px;
      box-shadow: 0 0 20px rgba(157,0,255,0.1);
    }
    .bubble ul { padding-left: 18px; margin-top: 6px; }
    .bubble li { margin-bottom: 4px; }
    .bubble code {
      background: #0a1a12;
      color: #00ffaa;
      border: 1px solid rgba(0,255,170,0.2);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 12.5px;
      font-family: "Cascadia Code", "Courier New", monospace;
    }
    .msg.user .bubble code {
      background: rgba(157,0,255,0.15);
      color: #c87aff;
      border-color: rgba(157,0,255,0.25);
    }
    .bubble .step-title {
      font-weight: 600; margin-top: 10px; display: block;
      color: #00ffaa;
      font-size: 12.5px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .bubble strong { color: #7eeac4; }
    .bubble em { color: #94a3b8; }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      background: rgba(255,200,0,0.12);
      color: #ffd600;
      border: 1px solid rgba(255,200,0,0.25);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 20px;
      margin-bottom: 6px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .badge.red {
      background: rgba(255,50,50,0.1);
      color: #ff6b6b;
      border-color: rgba(255,50,50,0.25);
    }
    .badge.green {
      background: rgba(0,255,170,0.08);
      color: #00ffaa;
      border-color: rgba(0,255,170,0.25);
    }

    /* ── Typing indicator ── */
    .typing-indicator {
      display: flex; gap: 5px; align-items: center; padding: 4px 2px;
    }
    .typing-indicator span {
      width: 7px; height: 7px;
      background: #00ffaa;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
      box-shadow: 0 0 6px rgba(0,255,170,0.5);
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; background: #9d00ff; box-shadow: 0 0 6px rgba(157,0,255,0.5); }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; background: #00aaff; box-shadow: 0 0 6px rgba(0,170,255,0.5); }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── Quick replies ── */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 0 2px 0;
    }
    .qr-btn {
      background: transparent;
      border: 1px solid rgba(0,255,170,0.35);
      color: #00ffaa;
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s, color 0.15s;
      font-family: inherit;
      letter-spacing: 0.2px;
    }
    .qr-btn:hover {
      background: rgba(0,255,170,0.1);
      box-shadow: 0 0 10px rgba(0,255,170,0.2);
      color: #00ffaa;
    }

    /* ── Input bar ── */
    .input-bar {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid rgba(0,255,170,0.12);
      flex-shrink: 0;
      background: #0a0f18;
    }
    .input-bar input {
      flex: 1;
      background: #0d1520;
      border: 1px solid rgba(0,255,170,0.2);
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      color: #c9d8e8;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-bar input:focus {
      border-color: rgba(0,255,170,0.5);
      box-shadow: 0 0 12px rgba(0,255,170,0.1);
    }
    .input-bar input::placeholder { color: #3a5060; }
    .send-btn {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #00cc88, #00ffaa);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: box-shadow 0.15s, transform 0.1s;
      box-shadow: 0 0 14px rgba(0,255,170,0.35);
    }
    .send-btn:hover {
      box-shadow: 0 0 22px rgba(0,255,170,0.55);
      transform: scale(1.05);
    }
    .send-btn svg { width: 18px; height: 18px; fill: #050810; }
    .send-btn:disabled {
      background: #1a2230;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Scan button ── */
    .scan-bar {
      padding: 10px 16px 0;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
      background: #0d1117;
      border-bottom: 1px solid rgba(0,255,170,0.07);
    }
    .scan-btn {
      background: transparent;
      border: 1px solid rgba(0,255,170,0.4);
      color: #00ffaa;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      letter-spacing: 0.3px;
    }
    .scan-btn:hover {
      background: rgba(0,255,170,0.08);
      box-shadow: 0 0 16px rgba(0,255,170,0.25);
    }
    .scan-btn:disabled {
      color: #2a4040;
      border-color: rgba(0,255,170,0.1);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* ── Spec card ── */
    .spec-card {
      background: #0a1520;
      border: 1px solid rgba(0,255,170,0.15);
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 8px;
      font-size: 13px;
      box-shadow: 0 0 20px rgba(0,255,170,0.05);
    }
    .spec-card table { width: 100%; border-collapse: collapse; }
    .spec-card td { padding: 5px 6px; vertical-align: top; }
    .spec-card td:first-child {
      color: #00ffaa;
      white-space: nowrap;
      width: 90px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .spec-card td:last-child { color: #c9d8e8; }
    .spec-card .disk-row { margin-top: 6px; color: #94a3b8; }
    .spec-card .disk-bar-bg {
      background: #0d1f14;
      border: 1px solid rgba(0,255,170,0.1);
      border-radius: 6px;
      height: 8px;
      margin-top: 4px;
      overflow: hidden;
    }
    .spec-card .disk-bar-fill {
      background: linear-gradient(90deg, #00cc88, #00ffaa);
      border-radius: 6px;
      height: 8px;
      box-shadow: 0 0 6px rgba(0,255,170,0.4);
    }
  </style>
</head>
<body>
<div class="chat-wrapper">
  <!-- Header -->
  <div class="chat-header">
    <div class="bot-avatar">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="3" width="20" height="14" rx="2" stroke="#00ffaa" stroke-width="2"/>
        <path d="M8 21h8M12 17v4" stroke="#00ffaa" stroke-width="2" stroke-linecap="round"/>
        <circle cx="8.5" cy="9.5" r="1.5" fill="#00ffaa"/>
        <circle cx="15.5" cy="9.5" r="1.5" fill="#00ffaa"/>
        <path d="M9 13s1 1.5 3 1.5 3-1.5 3-1.5" stroke="#00ffaa" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>PC Info &amp; Tech Assistant Bot</h1>
      <p>Helping you check specs &amp; understand your PC</p>
    </div>
    <div class="status-dot" title="Online"></div>
  </div>

  <!-- Scan bar -->
  <div class="scan-bar">
    <button class="scan-btn" id="scanBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      Scan My PC Specs
    </button>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages"></div>

  <!-- Input bar -->
  <div class="input-bar">
    <input id="userInput" type="text" placeholder="Ask about your PC specs…" autocomplete="off" />
    <button class="send-btn" id="sendBtn" title="Send">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script>
  // ─── State ───────────────────────────────────────────────────────────────────
  let failedAttempts = 0;
  let pendingOS = null;
  let pendingComponent = null;

  // ─── DOM ─────────────────────────────────────────────────────────────────────
  const messagesEl = document.getElementById('messages');
  const userInput  = document.getElementById('userInput');
  const sendBtn    = document.getElementById('sendBtn');
  const scanBtn    = document.getElementById('scanBtn');

  // ─── Scan My PC ──────────────────────────────────────────────────────────────
  async function fetchPCSpecs() {
    scanBtn.disabled = true;
    scanBtn.textContent = 'Scanning…';
    addMessage('user', '🔍 Scan my PC specs automatically');
    addTyping();
    try {
      const res = await fetch('http://localhost:3000/api/specs', { signal: AbortSignal.timeout(10000) });
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const s = await res.json();
      removeTyping();
      addMessage('bot', buildSpecCard(s));
    } catch (err) {
      removeTyping();
      const isConn = err.name === 'TypeError' || err.name === 'AbortError' || err.message.includes('fetch');
      addMessage('bot', isConn
        ? `<span class="badge red">Server Not Running</span>
           Saya tak dapat sambung ke local server. Sila pastikan server dah dijalankan:<br><br>
           <code>cd pc-info-bot</code><br>
           <code>node server.js</code><br><br>
           Lepas tu cuba klik <strong>Scan My PC Specs</strong> semula.`
        : `<span class="badge red">Error</span> ${escapeHtml(err.message)}`
      );
    }
    scanBtn.disabled = false;
    scanBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Scan My PC Specs';
    scrollBottom();
  }

  function buildSpecCard(s) {
    const gpuList = (s.gpu || []).map(g => '<div>' + escapeHtml(g) + '</div>').join('');
    const diskRows = (s.disks || []).map(d => {
      const totalGB = parseInt(d.total);
      const usedGB  = parseInt(d.used);
      const pct     = totalGB > 0 ? Math.min(100, Math.round((usedGB / totalGB) * 100)) : 0;
      return '<div class="disk-row">'
        + '<strong>' + escapeHtml(d.drive) + '</strong> — '
        + escapeHtml(d.used) + ' used / ' + escapeHtml(d.total) + ' total (' + escapeHtml(d.free) + ' free)'
        + '<div class="disk-bar-bg"><div class="disk-bar-fill" style="width:' + pct + '%"></div></div>'
        + '</div>';
    }).join('');

    return '<span class="badge green">✅ PC Specs Detected</span>'
      + '<div class="spec-card"><table>'
      + '<tr><td>OS</td><td>'  + escapeHtml(s.os  || 'Unknown') + '</td></tr>'
      + '<tr><td>CPU</td><td>' + escapeHtml(s.cpu || 'Unknown') + '</td></tr>'
      + '<tr><td>RAM</td><td>' + escapeHtml(s.ram || 'Unknown') + '</td></tr>'
      + '<tr><td>GPU</td><td>' + (gpuList || 'Unknown') + '</td></tr>'
      + '</table>'
      + (diskRows ? '<div style="margin-top:10px;font-weight:600;color:#64748b;font-size:12px;">STORAGE</div>' + diskRows : '')
      + '</div>'
      + 'Want me to explain any of these specs or guide you on checking them manually?';
  }

  scanBtn.addEventListener('click', fetchPCSpecs);

  // ─── Helpers ─────────────────────────────────────────────────────────────────
  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(role, html, extras) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'bot' ? '🖥' : 'You';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = html;

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);

    // Quick reply buttons
    if (extras && extras.quickReplies) {
      const qrWrap = document.createElement('div');
      qrWrap.className = 'msg bot';
      const qrAvSpacer = document.createElement('div');
      qrAvSpacer.style.width = '30px';
      qrAvSpacer.style.flexShrink = '0';
      const qrRow = document.createElement('div');
      qrRow.className = 'quick-replies';
      extras.quickReplies.forEach(label => {
        const btn = document.createElement('button');
        btn.className = 'qr-btn';
        btn.textContent = label;
        btn.onclick = () => {
          // Remove quick reply row after click
          qrWrap.remove();
          handleUserInput(label);
        };
        qrRow.appendChild(btn);
      });
      qrWrap.appendChild(qrAvSpacer);
      qrWrap.appendChild(qrRow);
      messagesEl.appendChild(qrWrap);
    }

    scrollBottom();
    return wrap;
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typing';
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = '🖥';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  function botReply(html, extras, delay = 900) {
    sendBtn.disabled = true;
    userInput.disabled = true;
    addTyping();
    return new Promise(resolve => {
      setTimeout(() => {
        removeTyping();
        addMessage('bot', html, extras);
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
        resolve();
      }, delay);
    });
  }

  // ─── Knowledge Base ──────────────────────────────────────────────────────────
  const GUIDES = {
    ram_cpu_windows: `
      <span class="badge green">Windows Guide</span>
      <strong>How to check RAM &amp; CPU on Windows:</strong>
      <span class="step-title">Option 1 — Task Manager</span>
      <ul>
        <li>Press <code>Ctrl + Shift + Esc</code> to open Task Manager.</li>
        <li>Click the <strong>Performance</strong> tab.</li>
        <li>Select <strong>CPU</strong> on the left to see your processor name, speed, and core count.</li>
        <li>Select <strong>Memory</strong> to see total RAM and how much is in use.</li>
      </ul>
      <span class="step-title">Option 2 — System Information</span>
      <ul>
        <li>Press <code>Win + R</code>, type <code>msinfo32</code>, then press Enter.</li>
        <li>Under <em>System Summary</em> you'll find <strong>Processor</strong> (CPU) and <strong>Installed Physical Memory (RAM)</strong>.</li>
      </ul>`,

    ram_cpu_mac: `
      <span class="badge green">macOS Guide</span>
      <strong>How to check RAM &amp; CPU on macOS:</strong>
      <ul>
        <li>Click the  <strong>Apple menu</strong> → <strong>About This Mac</strong>.</li>
        <li>The overview panel shows your <strong>Processor</strong> (CPU) and <strong>Memory</strong> (RAM) at a glance.</li>
      </ul>
      <span class="step-title">For more detail:</span>
      <ul>
        <li>Open <strong>Activity Monitor</strong> (search in Spotlight with <code>Cmd + Space</code>).</li>
        <li>Click the <strong>CPU</strong> tab for per-core usage, and the <strong>Memory</strong> tab for RAM usage breakdown.</li>
      </ul>`,

    ram_cpu_linux: `
      <span class="badge green">Linux Guide</span>
      <strong>How to check RAM &amp; CPU on Linux:</strong>
      <span class="step-title">CPU:</span>
      <ul>
        <li>Open a terminal and run: <code>lscpu</code></li>
        <li>This shows your CPU model, cores, threads, and speed.</li>
      </ul>
      <span class="step-title">RAM:</span>
      <ul>
        <li>Run: <code>free -h</code> to see total, used, and available memory in human-readable format.</li>
        <li>Or run: <code>cat /proc/meminfo</code> for detailed memory info.</li>
      </ul>`,

    ssd_windows: `
      <span class="badge green">Windows Guide</span>
      <strong>How to check SSD / storage space on Windows:</strong>
      <span class="step-title">Option 1 — File Explorer</span>
      <ul>
        <li>Open <strong>File Explorer</strong> (<code>Win + E</code>).</li>
        <li>Click <strong>This PC</strong> in the left sidebar.</li>
        <li>You'll see each drive with a bar showing used and free space.</li>
      </ul>
      <span class="step-title">Option 2 — Settings</span>
      <ul>
        <li>Go to <strong>Settings → System → Storage</strong>.</li>
        <li>This shows total capacity and a breakdown of what's using space.</li>
      </ul>
      <span class="step-title">Option 3 — Disk Management</span>
      <ul>

  // Helper — build a component info card
  function buildComponentInfo(key) {
    const c = COMPONENTS[key];
    if (!c) return null;
    const typesList = c.types.map(t => '<li>' + t + '</li>').join('');
    const brandsList = c.brands.join(', ');
    return `
      <span class="badge green">${c.icon} Component Info</span>

      <em>${c.what}</em>

      <ul>${typesList}</ul>
      <span class="step-title">Popular Brands:</span>
      ${brandsList}
      <span class="step-title">How to check on your PC:</span>
      <ul>
        <li><strong>Windows:</strong> ${c.check_windows}</li>
        <li><strong>macOS:</strong> ${c.check_mac}</li>
        <li><strong>Linux:</strong> ${c.check_linux}</li>
      </ul>`;
  }

  // ─── Intent Detection ────────────────────────────────────────────────────────
  function detectIntent(text) {
    const t = text.toLowerCase();

    // Repair / complex troubleshooting
    if (/\b(repair|replace|fix|solder|broke|broken|cracked|physical|hardware\s+issue|motherboard\s+fail|screen\s+broken|battery\s+swell|water\s+damage|won.t\s+turn\s+on|not\s+booting|won.t\s+boot|blue\s*screen|bsod|crash|freeze|stuck\s+on|reinstall\s+windows|format|virus|malware|driver\s+install)\b/.test(t)) {
      return 'out_of_scope';
    }

    // Greetings
    if (/^(hi|hello|hey|good\s+(morning|afternoon|evening)|howdy|greetings|helo|hai|selamat)[!?,.]?\s*$/.test(t.trim())) {
      return 'greeting';
    }

    // What can you do
    if (/what\s+can\s+you\s+do|what\s+do\s+you\s+help|help\s+me\s+with|capabilities|features|apa\s+yang|boleh\s+buat/.test(t)) {
      return 'capabilities';
    }

    // List all components
    if (/list\s+(all\s+)?component|all\s+component|semua\s+komponen|what\s+(are\s+)?pc\s+component|komponen\s+pc|bahagian\s+pc/.test(t)) {
      return 'list_components';
    }

    // Motherboard
    if (/\b(motherboard|mainboard|mobo|papan\s+induk|papan\s+mother)\b/.test(t)) return 'component_motherboard';

    // CPU
    if (/\b(cpu|processor|pemproses|core\s+i[0-9]|ryzen|xeon|m[12345]\s+chip|snapdragon\s+x)\b/.test(t)) return 'ram_cpu';

    // RAM
    if (/\b(ram|memory|memori|ddr[345]|so-?dimm|lpddr)\b/.test(t)) return 'ram_cpu';

    // GPU
    if (/\b(gpu|graphics|graphic\s+card|graphics\s+card|video\s+card|vram|display\s+adapter|rtx|gtx|radeon|geforce|intel\s+arc|kad\s+grafik)\b/.test(t)) return 'gpu';

    // Storage
    if (/\b(ssd|storage|storan|disk|drive|hard\s+drive|space|hdd|nvme|emmc|m\.2)\b/.test(t)) return 'ssd';

    // PSU
    if (/\b(psu|power\s+supply|bekalan\s+kuasa|wattage|80\+|watt\s+rating)\b/.test(t)) return 'component_psu';

    // Cooling
    if (/\b(cooling|cooler|fan|penyejukan|thermal|heatsink|aio|liquid\s+cool|heat\s+pipe|cpu\s+temp|temperature)\b/.test(t)) return 'component_cooling';

    // Monitor / Display
    if (/\b(monitor|display|screen|skrin|refresh\s+rate|resolution|hz|4k|1080p|1440p|oled|ips|va|panel)\b/.test(t)) return 'component_monitor';

    // Network
    if (/\b(wifi|wi-fi|wireless|ethernet|lan|network|rangkaian|adapter|bluetooth|internet\s+card)\b/.test(t)) return 'component_network';

    // Battery
    if (/\b(battery|bateri|batt|charge\s+cycle|mah|watt.?hour|battery\s+health|battery\s+report)\b/.test(t)) return 'component_battery';

    // Keyboard
    if (/\b(keyboard|papan\s+kekunci|mechanical|membrane|switch|keycap|tenkeyless|tkl)\b/.test(t)) return 'component_keyboard';

    // Mouse
    if (/\b(mouse|tetikus|dpi|polling\s+rate|optical\s+mouse|gaming\s+mouse|trackball)\b/.test(t)) return 'component_mouse';

    // Sound
    if (/\b(sound\s+card|audio|speaker|headphone|microphone|dac|realtek|bunyi|kad\s+bunyi)\b/.test(t)) return 'component_sound';

    // Webcam
    if (/\b(webcam|camera|kamera|web\s+cam|video\s+call|streaming\s+cam)\b/.test(t)) return 'component_webcam';

    // Case
    if (/\b(case|casing|chassis|tower|mid\s+tower|mini\s+itx|atx\s+case)\b/.test(t)) return 'component_case_chassis';

    // Optical
    if (/\b(optical|dvd|blu.?ray|cd\s+drive|disc\s+drive|dvd\s+writer)\b/.test(t)) return 'component_optical';

    // Ports
    if (/\b(port|usb|thunderbolt|hdmi|displayport|usb.c|connectivity|sambungan)\b/.test(t)) return 'component_ports';

    return 'unknown';
  }

  function detectOS(text) {
    const t = text.toLowerCase();
    if (/\b(windows|win\s*10|win\s*11|laptop|pc)\b/.test(t)) return 'windows';
    if (/\b(mac|macos|macbook|apple|osx|os\s*x)\b/.test(t)) return 'mac';
    if (/\b(linux|ubuntu|debian|fedora|arch|mint|pop!?\s*os|terminal)\b/.test(t)) return 'linux';
    return null;
  }

  function getGuide(component, os) {
    return GUIDES[`${component}_${os}`] || null;
  }

  // ─── Response Logic ───────────────────────────────────────────────────────────
  async function handleUserInput(text) {
    const trimmed = text.trim();
    if (!trimmed) return;

    addMessage('user', escapeHtml(trimmed));

    // ── Resolve pending OS question ──────────────────────────────────────────
    if (pendingComponent) {
      const os = detectOS(trimmed);
      if (os) {
        const comp = pendingComponent;
        pendingComponent = null;
        failedAttempts = 0;
        const guide = getGuide(comp, os);
        await botReply(guide);
        return;
      } else {
        // Still couldn't determine OS
        pendingComponent = null;
        failedAttempts++;
        if (failedAttempts >= 2) {
          await botReply(humanHandoff());
          return;
        }
        await botReply(
          `Sorry, I didn't catch which operating system you're using. Could you specify <strong>Windows</strong>, <strong>macOS</strong>, or <strong>Linux</strong>?`,
          { quickReplies: ['Windows', 'macOS', 'Linux'] }
        );
        return;
      }
    }

    const intent = detectIntent(trimmed);
    const os = detectOS(trimmed);

    // ── Out of scope ─────────────────────────────────────────────────────────
    if (intent === 'out_of_scope') {
      failedAttempts = 0;
      await botReply(`
        <span class="badge red">Out of Scope</span>
        That sounds like it may involve physical hardware repair or complex system troubleshooting — which is outside what I can help with.<br><br>
        I'll connect you with a <strong>human technician</strong> who can assist you properly. Please hold on or visit your nearest service centre. 🛠️
      `);
      return;
    }

    // ── Greeting ─────────────────────────────────────────────────────────────
    if (intent === 'greeting') {
      failedAttempts = 0;
      await botReply(
        `👋 Hello! I'm the <strong>PC Info &amp; Tech Assistant Bot</strong>.<br>I can help you check your PC's specs — RAM, CPU, SSD storage, and GPU — on Windows, macOS, or Linux.<br><br>What would you like to know?`,
        { quickReplies: ['Check RAM & CPU', 'Check SSD Storage', 'Check GPU', 'What can you do?'] }
      );
      return;
    }

    // ── Capabilities ─────────────────────────────────────────────────────────
    if (intent === 'capabilities') {
      failedAttempts = 0;
      await botReply(`
        Here's what I can help you with:
        <ul>
          <li>🔍 How to check your <strong>RAM &amp; CPU</strong></li>
          <li>💾 How to check your <strong>SSD / Storage space</strong></li>
          <li>🎮 How to check your <strong>GPU / Graphics Card</strong></li>
        </ul>
        I support <strong>Windows</strong>, <strong>macOS</strong>, and <strong>Linux</strong>.<br><br>
        <em>Note: I don't handle physical repairs or complex troubleshooting — I'll hand those off to a human technician.</em>
      `, { quickReplies: ['Check RAM & CPU', 'Check SSD Storage', 'Check GPU'] });
      return;
    }

    // ── List all components ──────────────────────────────────────────────────
    if (intent === 'list_components') {
      failedAttempts = 0;
      const items = Object.values(COMPONENTS).map(c => '<li>' + c.icon + ' <strong>' + c.name + '</strong> — ' + c.what.split('.')[0] + '.</li>').join('');
      await botReply(
        '<span class="badge green">📋 PC Components</span>'
        + 'Here are all the PC/laptop components I know about:<ul>' + items + '</ul>'
        + 'Ask me about any one of them for more details!',
        { quickReplies: ['CPU', 'RAM', 'GPU', 'Motherboard', 'Battery', 'PSU', 'Cooling', 'Ports'] }
      );
      return;
    }

    // ── Known guide component (RAM/CPU/SSD/GPU — has per-OS guides) ──────────
    if (intent === 'ram_cpu' || intent === 'ssd' || intent === 'gpu') {
      failedAttempts = 0;
      if (os) {
        const guide = getGuide(intent, os);
        if (guide) {
          await botReply(guide);
        }
      } else {
        pendingComponent = intent;
        const compName = intent === 'ram_cpu' ? 'RAM &amp; CPU' : intent === 'ssd' ? 'SSD storage' : 'GPU';
        await botReply(
          `Sure, I can guide you on checking your <strong>${compName}</strong>! Which operating system are you using?`,
          { quickReplies: ['Windows', 'macOS', 'Linux'] }
        );
      }
      return;
    }

    // ── Component info (no OS-specific guide needed) ─────────────────────────
    if (intent.startsWith('component_')) {
      failedAttempts = 0;
      const key = intent.replace('component_', '');
      const card = buildComponentInfo(key);
      if (card) {
        await botReply(card, { quickReplies: ['List all components', 'Check RAM & CPU', 'Check SSD Storage', 'Check GPU'] });
      }
      return;
    }

    // ── Unknown ───────────────────────────────────────────────────────────────
    failedAttempts++;
    if (failedAttempts >= 2) {
      await botReply(humanHandoff());
      failedAttempts = 0;
    } else {
      await botReply(`
        I'm sorry, I didn't quite understand that. 🤔<br><br>
        I can help you check PC specs and explain components like <strong>CPU, RAM, GPU, SSD, Motherboard, PSU, Cooling, Battery</strong>, and more. Try asking about a specific component, or:
      `, { quickReplies: ['List all components', 'Check RAM & CPU', 'Check GPU', 'What can you do?'] });
    }
  }

  function humanHandoff() {
    return `
      <span class="badge red">Connecting to Human</span>
      I'm sorry I wasn't able to help with that after a couple of tries. 😔<br><br>
      I'll connect you to a <strong>human technician</strong> who will be better equipped to assist you. Please stand by — someone will be with you shortly. 👨‍💻
    `;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ─── Event Listeners ─────────────────────────────────────────────────────────
  sendBtn.addEventListener('click', () => {
    const val = userInput.value.trim();
    if (!val) return;
    userInput.value = '';
    handleUserInput(val);
  });

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const val = userInput.value.trim();
      if (!val) return;
      userInput.value = '';
      handleUserInput(val);
    }
  });

  // ─── Welcome message ──────────────────────────────────────────────────────────
  window.addEventListener('load', () => {
    botReply(
      `👋 Hi there! I'm your <strong>PC Info &amp; Tech Assistant Bot</strong>.<br><br>
      I know about <strong>16 PC/laptop components</strong> — CPU, RAM, GPU, SSD, Motherboard, PSU, Cooling, Monitor, WiFi, Battery, Keyboard, Mouse, Audio, Webcam, Case, Ports, and more.<br><br>
      💡 <strong>Tip:</strong> Click <strong>"Scan My PC Specs"</strong> above to automatically detect your specs (requires the local server to be running).<br><br>
      What would you like to know?`,
      { quickReplies: ['List all components', 'Check RAM & CPU', 'Check GPU', 'What can you do?'] },
      600
    );
  });
</script>
</body>
</html>
